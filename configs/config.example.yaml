server:
  listen: "192.168.1.20:443"
  certificate: "/etc/lego/certificates/monitor.example.invalid.crt"
  private_key: "/etc/lego/certificates/monitor.example.invalid.key"
  read_timeout: "10s"
  write_timeout: "15s"
  idle_timeout: "60s"
  shutdown_timeout: "15s"
  max_header_bytes: 16384

authentication:
  bearer_token_file: "/etc/automation-gateway/token"
  health_public: true

logging:
  level: "info"

collectors:
  nut:
    enabled: true
    server: "127.0.0.1:3493"
    ups: "quint"
    poll_interval: "10s"
    stale_after: "30s"
    timeout: "5s"

  wago:
    enabled: true
    address: "192.168.1.11"
    port: 161
    poll_interval: "30s"
    stale_after: "90s"
    timeout: "5s"
    # This fixed allowlist is the only set polled in normal operation.
    oids:
      - "1.3.6.1.2.1.1.3.0"
      - "1.3.6.1.2.1.1.5.0"
    metadata_file: "/etc/automation-gateway/mib-metadata.json"
    snmp:
      version: "3"
      username: "monitoring-account"
      auth_protocol: "SHA"
      auth_passphrase_file: "/etc/automation-gateway/secrets/wago-auth"
      privacy_protocol: "DES"
      privacy_passphrase_file: "/etc/automation-gateway/secrets/wago-priv"
    discovery:
      enabled: true
      root_oids:
        - "1.3.6.1.2.1"
        - "1.3.6.1.4.1"
