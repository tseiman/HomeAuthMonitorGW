      discovery_rules:
        - uuid: 94e2c190142349e8999ffa4c55c5ab2e
          name: 'Discover gateway sources'
          type: DEPENDENT
          key: automation.gateway.sources.discovery
          delay: '0'
          lifetime: '7d'
          description: 'Discovers source instances from the cached master snapshot without another HTTP request.'
          item_prototypes:
            - uuid: 73161e1d7ef64caf9a7619927f0e98b8
              name: 'Source {#SOURCE}: available'
              type: DEPENDENT
              key: 'automation.gateway.source.available["{#SOURCE}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              description: 'One means the most recent collector attempt succeeded; zero means it failed.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}.available'
                - type: JAVASCRIPT
                  parameters:
                    - 'return value === "true" ? 1 : 0;'
              tags:
                - tag: component
                  value: source
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
            - uuid: e58ffbd0227f4a409012c6e5a36ff2cb
              name: 'Source {#SOURCE}: stale'
              type: DEPENDENT
              key: 'automation.gateway.source.stale["{#SOURCE}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              description: 'One means cached source values exceed their configured freshness threshold.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}.stale'
                - type: JAVASCRIPT
                  parameters:
                    - 'return value === "true" ? 1 : 0;'
              tags:
                - tag: component
                  value: source
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
            - uuid: c90c81ede4ab442aa1d58255fe185abb
              name: 'TS Service health: {#SOURCE}'
              type: DEPENDENT
              key: 'automation.gateway.source.health["{#SOURCE}"]'
              history: '30d'
              trends: '365d'
              value_type: UNSIGNED
              description: 'Independent generic health for this collector: 0 good, 1 degraded, 2 real issue or unavailable.'
              valuemap:
                name: 'Collector health'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var source = JSON.parse(value);
                      if (!source.last_success || source.last_success === '0001-01-01T00:00:00Z') return 1;
                      if (!source.available) return 2;
                      if (source.stale || source.metrics.length === 0) return 1;
                      return 0;
              tags:
                - tag: component
                  value: health
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
            - uuid: 9aae70fb921846059e08c2982cfddf06
              name: 'Source {#SOURCE}: last successful poll'
              type: DEPENDENT
              key: 'automation.gateway.source.last_success["{#SOURCE}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              units: unixtime
              description: 'UTC Unix time of the last successful collector poll.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}.last_success'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value === '0001-01-01T00:00:00Z') {
                          return 0;
                      }
                      var timestamp = Date.parse(value);
                      if (isNaN(timestamp) || timestamp < 0) {
                          throw 'invalid last_success timestamp';
                      }
                      return Math.floor(timestamp / 1000);
              tags:
                - tag: component
                  value: source
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
          trigger_prototypes:
            - uuid: d9ab70eba9b2473ba9b9f0b948032be2
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.source.available["{#SOURCE}"])=0'
              name: 'Source {#SOURCE} is unavailable'
              priority: HIGH
              description: 'The latest independent collector attempt failed. The gateway can still expose a last-known-good cached value.'
              tags:
                - tag: scope
                  value: availability
                - tag: source
                  value: '{#SOURCE}'
            - uuid: 7c457edf8c714b0e8f10c954f38ca530
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.source.stale["{#SOURCE}"])=1'
              name: 'Source {#SOURCE} data is stale'
              priority: WARNING
              description: 'Cached values remain visible but must not be treated as current.'
              tags:
                - tag: scope
                  value: freshness
                - tag: source
                  value: '{#SOURCE}'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var sources = [];
                  Object.keys(snapshot).sort().forEach(function (name) {
                      var source = snapshot[name];
                      if (!source || typeof source !== 'object') {
                          return;
                      }
                      sources.push({
                          '{#SOURCE}': name,
                          '{#DRIVER}': typeof source.driver === 'string' ? source.driver : 'unknown',
                          '{#SOURCEPATH}': '$[' + JSON.stringify(name) + ']'
                      });
                  });
                  return JSON.stringify(sources);
        - uuid: 35b809bc79c54e9bad77971a410243b7
          name: 'Discover gateway metrics'
          type: DEPENDENT
          key: automation.gateway.metrics.discovery
          delay: '0'
          lifetime: '7d'
          description: 'Discovers all metric names in every cached source snapshot without another HTTP request.'
          item_prototypes:
            - uuid: 12f9b6497de6437dba2009e0142f3e52
              name: 'Source {#SOURCE}: metric {#METRIC}'
              type: DEPENDENT
              key: 'automation.gateway.metric["{#SOURCE}","{#METRIC_KEY}"]'
              history: '7d'
              trends: '0'
              value_type: TEXT
              description: '{#DESCRIPTION}'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#VALUE_JSONPATH}'
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
                - tag: value-type
                  value: '{#VALUE_TYPE}'
                - tag: unit
                  value: '{#UNIT}'
            - uuid: 7f5faf4a75f1429593ac5b5f2d5d0627
              name: 'Source {#SOURCE}: metric {#METRIC} timestamp'
              type: DEPENDENT
              key: 'automation.gateway.metric.timestamp["{#SOURCE}","{#METRIC_KEY}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              units: unixtime
              description: 'UTC Unix time attached to the cached metric value.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#TIMESTAMP_JSONPATH}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var timestamp = Date.parse(value);
                      if (isNaN(timestamp) || timestamp < 0) {
                          throw 'invalid metric timestamp';
                      }
                      return Math.floor(timestamp / 1000);
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var discovered = [];
                  Object.keys(snapshot).sort().forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!source || !Array.isArray(source.metrics)) {
                          return;
                      }
                      source.metrics.forEach(function (metric) {
                          if (!metric || typeof metric.name !== 'string') {
                              return;
                          }
                          if (metric.value_type !== 'string' && metric.value_type !== 'hex') {
                              return;
                          }
                          var metricID = metric.name;
                          var selector = '@.name == ' + JSON.stringify(metric.name);
                          if (metric.labels && typeof metric.labels.oid === 'string') {
                              metricID = metric.labels.oid;
                              selector = '@.labels.oid == ' + JSON.stringify(metric.labels.oid);
                          }
                          var metricKey = '';
                          for (var index = 0; index < metricID.length; index++) {
                              metricKey += ('0000' + metricID.charCodeAt(index).toString(16)).slice(-4);
                          }
                          var base = '$[' + JSON.stringify(sourceName) + '].metrics[?(' + selector + ')]';
                          discovered.push({
                              '{#SOURCE}': sourceName,
                              '{#DRIVER}': typeof source.driver === 'string' ? source.driver : 'unknown',
                              '{#METRIC}': metric.name,
                              '{#METRIC_ID}': metricID,
                              '{#METRIC_KEY}': metricKey,
                              '{#VALUE_TYPE}': typeof metric.value_type === 'string' ? metric.value_type : 'unknown',
                              '{#UNIT}': typeof metric.unit === 'string' ? metric.unit : '',
                              '{#DESCRIPTION}': typeof metric.description === 'string' ? metric.description : 'Current cached text value for ' + metric.name + '.',
                              '{#VALUE_JSONPATH}': base + '.value.first()',
                              '{#TIMESTAMP_JSONPATH}': base + '.timestamp.first()'
                          });
                      });
                  });
                  discovered.sort(function (left, right) {
                      var leftKey = left['{#SOURCE}'] + '\u0000' + left['{#METRIC}'];
                      var rightKey = right['{#SOURCE}'] + '\u0000' + right['{#METRIC}'];
                      return leftKey < rightKey ? -1 : (leftKey > rightKey ? 1 : 0);
                  });
                  return JSON.stringify(discovered);
        - uuid: e53e925bcdb3435ba5fc567f19ba55b3
          name: 'Discover numeric gateway metrics'
          type: DEPENDENT
          key: automation.gateway.numeric_metrics.discovery
          delay: '0'
          lifetime: '7d'
          description: 'Discovers numeric values separately so Zabbix can retain trends and apply numeric triggers.'
          item_prototypes:
            - uuid: 0ace423d3a7b4ce6881b42a2528dadf5
              name: 'Source {#SOURCE}: metric {#METRIC}'
              type: DEPENDENT
              key: 'automation.gateway.metric.numeric["{#SOURCE}","{#METRIC_KEY}"]'
              history: '30d'
              trends: '365d'
              value_type: FLOAT
              units: '{#DISPLAY_UNIT}'
              description: '{#DESCRIPTION}'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#VALUE_JSONPATH}'
                - type: MULTIPLIER
                  parameters:
                    - '{#MULTIPLIER}'
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
                - tag: value-type
                  value: '{#VALUE_TYPE}'
                - tag: unit
                  value: '{#DISPLAY_UNIT}'
            - uuid: 7688bc15166d44db9e4e362a73ce6928
              name: 'Source {#SOURCE}: metric {#METRIC} timestamp'
              type: DEPENDENT
              key: 'automation.gateway.metric.numeric.timestamp["{#SOURCE}","{#METRIC_KEY}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              units: unixtime
              description: 'UTC Unix time attached to the cached numeric metric value.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#TIMESTAMP_JSONPATH}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var timestamp = Date.parse(value);
                      if (isNaN(timestamp) || timestamp < 0) {
                          throw 'invalid metric timestamp';
                      }
                      return Math.floor(timestamp / 1000);
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var discovered = [];
                  Object.keys(snapshot).sort().forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!source || !Array.isArray(source.metrics)) {
                          return;
                      }
                      source.metrics.forEach(function (metric) {
                          if (!metric || typeof metric.name !== 'string') {
                              return;
                          }
                          if (metric.value_type !== 'integer' && metric.value_type !== 'counter' && metric.value_type !== 'number') {
                              return;
                          }
                          var metricID = metric.name;
                          var selector = '@.name == ' + JSON.stringify(metric.name);
                          if (metric.labels && typeof metric.labels.oid === 'string') {
                              metricID = metric.labels.oid;
                              selector = '@.labels.oid == ' + JSON.stringify(metric.labels.oid);
                          }
                          var metricKey = '';
                          for (var index = 0; index < metricID.length; index++) {
                              metricKey += ('0000' + metricID.charCodeAt(index).toString(16)).slice(-4);
                          }
                          var base = '$[' + JSON.stringify(sourceName) + '].metrics[?(' + selector + ')]';
                          var multiplier = metric.unit === 'centiseconds' ? '0.01' : '1';
                          var displayUnit = typeof metric.unit === 'string' ? metric.unit : '';
                          if (metric.unit === 'centiseconds') {
                              displayUnit = metric.name === 'sysUpTime' ? 'uptime' : 's';
                          }
                          discovered.push({
                              '{#SOURCE}': sourceName,
                              '{#DRIVER}': typeof source.driver === 'string' ? source.driver : 'unknown',
                              '{#METRIC}': metric.name,
                              '{#METRIC_ID}': metricID,
                              '{#METRIC_KEY}': metricKey,
                              '{#VALUE_TYPE}': metric.value_type,
                              '{#DISPLAY_UNIT}': displayUnit,
                              '{#MULTIPLIER}': multiplier,
                              '{#DESCRIPTION}': typeof metric.description === 'string' ? metric.description : 'Current cached numeric value for ' + metric.name + '.',
                              '{#VALUE_JSONPATH}': base + '.value.first()',
                              '{#TIMESTAMP_JSONPATH}': base + '.timestamp.first()'
                          });
                      });
                  });
                  discovered.sort(function (left, right) {
                      var leftKey = left['{#SOURCE}'] + '\u0000' + left['{#METRIC}'];
                      var rightKey = right['{#SOURCE}'] + '\u0000' + right['{#METRIC}'];
                      return leftKey < rightKey ? -1 : (leftKey > rightKey ? 1 : 0);
                  });
                  return JSON.stringify(discovered);
