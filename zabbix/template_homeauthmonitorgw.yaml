zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 68325ff09e144b84a2f207a24b410450
      name: Templates/HomeAuthMonitorGW
  templates:
    - uuid: 60d4f3523b094da0a49b477eba03ee37
      template: 'Template HomeAuthMonitorGW by HTTP'
      name: 'Template HomeAuthMonitorGW by HTTP'
      description: 'Read-only monitoring through one authenticated HomeAuthMonitorGW HTTPS cache snapshot.'
      groups:
        - name: Templates/HomeAuthMonitorGW
      items:
        - uuid: a70ce834f05e40b3afc07eaf63b44e9c
          name: 'Automation gateway snapshot'
          type: HTTP_AGENT
          key: automation.gateway.snapshot
          delay: '{$AUTOMATION_GATEWAY_INTERVAL}'
          history: '1d'
          trends: '0'
          value_type: TEXT
          url: '{$AUTOMATION_GATEWAY_URL}/api/v1/metrics'
          status_codes: '200'
          follow_redirects: 'NO'
          retrieve_mode: BODY
          output_format: RAW
          timeout: '{$AUTOMATION_GATEWAY_TIMEOUT}'
          verify_peer: 'YES'
          verify_host: 'YES'
          headers:
            - name: Authorization
              value: 'Bearer {$AUTOMATION_GATEWAY_TOKEN}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  if (!snapshot || Array.isArray(snapshot) || typeof snapshot !== 'object') {
                      throw 'snapshot root must be an object';
                  }
                  Object.keys(snapshot).forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!/^[A-Za-z0-9._-]{1,64}$/.test(sourceName) || !source || typeof source !== 'object' || Array.isArray(source)) {
                          throw 'invalid source entry';
                      }
                      if (typeof source.driver !== 'string' || typeof source.available !== 'boolean' || typeof source.stale !== 'boolean' || typeof source.last_success !== 'string' || !Array.isArray(source.metrics)) {
                          throw 'invalid source schema';
                      }
                      if (source.last_success !== '0001-01-01T00:00:00Z' && (isNaN(Date.parse(source.last_success)) || Date.parse(source.last_success) < 0)) {
                          throw 'invalid source timestamp';
                      }
                      source.metrics.forEach(function (metric) {
                          if (!metric || typeof metric !== 'object' || Array.isArray(metric) || typeof metric.name !== 'string' || metric.name.length < 1 || metric.name.length > 128 || typeof metric.value_type !== 'string' || typeof metric.timestamp !== 'string' || !Object.prototype.hasOwnProperty.call(metric, 'value')) {
                              throw 'invalid metric schema';
                          }
                          if (isNaN(Date.parse(metric.timestamp)) || Date.parse(metric.timestamp) < 0) {
                              throw 'invalid metric timestamp';
                          }
                      });
                  });
                  return value;
          tags:
            - tag: component
              value: gateway
          triggers:
            - uuid: 722e5bc23d8845e69a5ba6bc2427fffd
              expression: 'nodata(/Template HomeAuthMonitorGW by HTTP/automation.gateway.snapshot,5m)=1'
              name: 'Automation gateway has no snapshot data for 5 minutes'
              priority: HIGH
              description: 'The authenticated HTTPS master item has produced no value for five minutes. Check TLS, allowlist, token, and gateway availability.'
        - uuid: 1e0f1d2b76894e31ad44529eb2f21f4d
          name: 'TS Service health: HeimAuto'
          type: DEPENDENT
          key: automation.gateway.health.overall
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Aggregate of every configured collector. The highest state wins: 0 good, 1 degraded, 2 real issue or unavailable.'
          valuemap:
            name: 'Overall collector health'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var sourceNames = Object.keys(snapshot);
                  if (sourceNames.length === 0) return 1;
                  var overall = 0;
                  function worsen(state) {
                      if (state > overall) overall = state;
                  }
                  function has(object, key) {
                      return Object.prototype.hasOwnProperty.call(object, key);
                  }
                  function invalidOrNotZero(value) {
                      return isNaN(Number(value)) || Number(value) !== 0;
                  }
                  sourceNames.forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!source.last_success || source.last_success === '0001-01-01T00:00:00Z') {
                          worsen(1);
                          return;
                      }
                      if (!source.available) {
                          worsen(2);
                          return;
                      }
                      if (source.stale) worsen(1);
                      if (source.metrics.length === 0) {
                          worsen(1);
                          return;
                      }
                      var byName = {};
                      var byOID = {};
                      var wagoLike = false;
                      source.metrics.forEach(function (metric) {
                          byName[metric.name] = metric.value;
                          if (metric.labels && typeof metric.labels.oid === 'string') {
                              var oid = metric.labels.oid.replace(/^\./, '');
                              byOID[oid] = metric.value;
                              if (oid.indexOf('1.3.6.1.4.1.13576.') === 0) wagoLike = true;
                          }
                          if (metric.name.indexOf('wio') === 0) wagoLike = true;
                      });
                      if (source.driver === 'nut') {
                          var requiredNUT = ['ups.status', 'battery.charge', 'battery.temperature'];
                          requiredNUT.forEach(function (name) { if (!has(byName, name)) worsen(1); });
                          var status = String(byName['ups.status'] || '');
                          var tokens = status ? status.split(/\s+/) : [];
                          if (tokens.indexOf('LB') >= 0 || tokens.indexOf('FSD') >= 0 || tokens.indexOf('OFF') >= 0) worsen(2);
                          else if (!status || tokens.indexOf('OL') < 0) worsen(1);
                          var charge = Number(byName['battery.charge']);
                          var temperature = Number(byName['battery.temperature']);
                          if (has(byName, 'battery.charge') && (isNaN(charge) || charge < Number('{$PHOENIX_BATTERY_CRITICAL}'))) worsen(2);
                          else if (has(byName, 'battery.charge') && charge < Number('{$PHOENIX_BATTERY_WARNING}')) worsen(1);
                          if (has(byName, 'battery.temperature') && (isNaN(temperature) || temperature >= Number('{$PHOENIX_TEMPERATURE_CRITICAL}'))) worsen(2);
                          else if (has(byName, 'battery.temperature') && temperature >= Number('{$PHOENIX_TEMPERATURE_WARNING}')) worsen(1);
                      } else if (source.driver === 'snmp' && wagoLike) {
                          var errorGroup = '1.3.6.1.4.1.13576.10.1.20.1.0';
                          var errorCode = '1.3.6.1.4.1.13576.10.1.20.2.0';
                          var errorDescription = '1.3.6.1.4.1.13576.10.1.20.4.0';
                          var rtcBattery = '1.3.6.1.4.1.13576.10.1.11.5.0';
                          [errorGroup, errorCode, errorDescription, rtcBattery].forEach(function (oid) { if (!has(byOID, oid)) worsen(1); });
                          if (has(byOID, errorGroup) && invalidOrNotZero(byOID[errorGroup])) worsen(2);
                          if (has(byOID, errorCode) && invalidOrNotZero(byOID[errorCode])) worsen(2);
                          if (has(byOID, rtcBattery) && invalidOrNotZero(byOID[rtcBattery])) worsen(1);
                      }
                  });
                  return overall;
          tags:
            - tag: component
              value: health
            - tag: scope
              value: overall
        - uuid: 1fa248c88e9c48c38ed250719763a212
          name: 'TS Service health: WAGO 750-880'
          type: DEPENDENT
          key: automation.gateway.wago.health
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Independent WAGO collector health: 0 good, 1 degraded, 2 real issue or unavailable. Combines reachability, staleness, WAGO error group/code, and RTC battery state.'
          valuemap:
            name: 'Collector health'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"]'
            - type: JAVASCRIPT
              parameters:
                - |
                  var source = JSON.parse(value);
                  if (!source.available) return 2;
                  var health = source.stale ? 1 : 0;
                  var values = {};
                  source.metrics.forEach(function (metric) {
                      if (metric.labels && typeof metric.labels.oid === 'string') values[metric.labels.oid] = metric.value;
                  });
                  var required = ['1.3.6.1.4.1.13576.10.1.20.1.0', '1.3.6.1.4.1.13576.10.1.20.2.0', '1.3.6.1.4.1.13576.10.1.20.4.0', '1.3.6.1.4.1.13576.10.1.11.5.0'];
                  required.forEach(function (oid) { if (!Object.prototype.hasOwnProperty.call(values, oid)) health = 1; });
                  if ((Object.prototype.hasOwnProperty.call(values, '1.3.6.1.4.1.13576.10.1.20.1.0') && Number(values['1.3.6.1.4.1.13576.10.1.20.1.0']) !== 0) || (Object.prototype.hasOwnProperty.call(values, '1.3.6.1.4.1.13576.10.1.20.2.0') && Number(values['1.3.6.1.4.1.13576.10.1.20.2.0']) !== 0)) return 2;
                  if (Object.prototype.hasOwnProperty.call(values, '1.3.6.1.4.1.13576.10.1.11.5.0') && Number(values['1.3.6.1.4.1.13576.10.1.11.5.0']) !== 0) health = 1;
                  return health;
          tags:
            - tag: component
              value: health
            - tag: device
              value: wago
          triggers:
            - uuid: c7bf160795a84d2dbb13601d5154f496
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.wago.health)=2'
              name: 'WAGO service health has a real issue or is unavailable'
              priority: HIGH
            - uuid: 472d5a45cf244473aabd2ece2a4bea98
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.wago.health)=1'
              name: 'WAGO service health is degraded'
              priority: WARNING
        - uuid: 9e0913d22e404082a7c20fdc461ab4f1
          name: 'WAGO: System uptime'
          type: DEPENDENT
          key: automation.gateway.wago.uptime
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: uptime
          description: 'Controller uptime converted from SNMP TimeTicks (centiseconds) to seconds for human-readable Zabbix display.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.2.1.1.3.0")].value.first()'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: device
              value: wago
          triggers:
            - uuid: f18de41ba3e14f3ab6d5167f719860b0
              expression: 'change(/Template HomeAuthMonitorGW by HTTP/automation.gateway.wago.uptime)<0'
              name: 'WAGO controller has restarted'
              priority: WARNING
        - uuid: 34541c5c0c8e4a9b800f7cb5bf4d7346
          name: 'WAGO: Diagnostic status'
          type: DEPENDENT
          key: automation.gateway.wago.diagnostic
          history: '30d'
          trends: '0'
          value_type: TEXT
          description: 'Human-readable WAGO diagnostic, for example Coupler running, OK.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.20.4.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: 647862f2e1d54b0788b2dd4c7c056b2e
          name: 'WAGO: Diagnostic error code'
          type: DEPENDENT
          key: automation.gateway.wago.error_code
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Current WAGO diagnostic error code; zero means no reported error.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.20.2.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: 828b4c9211764f7586edc1731b83e1cb
          name: 'WAGO: RTC battery status'
          type: DEPENDENT
          key: automation.gateway.wago.rtc_battery
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'RTC backup-battery state reported by the WAGO controller.'
          valuemap:
            name: 'WAGO RTC battery status'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.11.5.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: 4cad44fe65464b9ba4f9c4f6c0d082cd
          name: 'WAGO: IEC task status'
          type: DEPENDENT
          key: automation.gateway.wago.iec_task_status
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Raw IEC task status. No RUN/STOP trigger is enabled until the vendor-specific numeric meanings are observed and confirmed.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.30.9.1.3.1")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: a89ec50e50804a8b9657c965dd66215f
          name: 'WAGO: IEC task cycle time'
          type: DEPENDENT
          key: automation.gateway.wago.iec_cycle_time
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: µs
          description: 'Current IEC task execution time in microseconds, matching the CODESYS task-monitoring cycle-time unit.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.30.9.1.9.1")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: ff0ced275437462baf773cb45de4ae5a
          name: 'WAGO: Firmware version'
          type: DEPENDENT
          key: automation.gateway.wago.firmware
          history: '30d'
          trends: '0'
          value_type: TEXT
          description: 'Installed WAGO controller firmware version.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.10.4.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: ca4f7a70756e4848b6abc859b8ffaa38
          name: 'WAGO: CODESYS project ID'
          type: DEPENDENT
          key: automation.gateway.wago.project_id
          history: '90d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Numeric identifier of the loaded CODESYS project. A change can indicate a new project download.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.name == "wioProjectId")].value.first()'
          tags:
            - tag: component
              value: software
            - tag: device
              value: wago
        - uuid: a5881e28f7d54e32b5ea4e566ffa8417
          name: 'WAGO: CODESYS project name'
          type: DEPENDENT
          key: automation.gateway.wago.project_name
          history: '90d'
          trends: '0'
          value_type: TEXT
          description: 'Name of the loaded CODESYS project.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.name == "wioProjectName")].value.first()'
          tags:
            - tag: component
              value: software
            - tag: device
              value: wago
        - uuid: 57672c3f4f454f7e90215a4b5b53ae1d
          name: 'WAGO: CODESYS project version'
          type: DEPENDENT
          key: automation.gateway.wago.project_version
          history: '90d'
          trends: '0'
          value_type: TEXT
          description: 'Project-defined CODESYS version, or Not set when the project reports an empty version.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var source = snapshot['{$WAGO_SOURCE}'];
                  if (!source || !Array.isArray(source.metrics)) throw 'WAGO source not found';
                  for (var index = 0; index < source.metrics.length; index++) {
                      if (source.metrics[index].name === 'wioProjectVersion') {
                          var version = String(source.metrics[index].value == null ? '' : source.metrics[index].value).trim();
                          return version || 'Not set';
                      }
                  }
                  return 'Not reported';
          tags:
            - tag: component
              value: software
            - tag: device
              value: wago
        - uuid: b0410012e4e1422986ff01fb10178c5b
          name: 'WAGO: CODESYS software information'
          type: DEPENDENT
          key: automation.gateway.wago.software_info
          history: '90d'
          trends: '0'
          value_type: TEXT
          description: 'Combined CODESYS project and IEC task information for the WAGO dashboard.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var source = snapshot['{$WAGO_SOURCE}'];
                  if (!source || !Array.isArray(source.metrics)) throw 'WAGO source not found';
                  var values = {};
                  source.metrics.forEach(function (metric) { values[metric.name] = metric.value; });
                  function display(name, emptyValue) {
                      if (!Object.prototype.hasOwnProperty.call(values, name) || values[name] == null || String(values[name]).trim() === '') return emptyValue;
                      return String(values[name]);
                  }
                  function cycleTime(name) {
                      var result = display(name, 'Not reported');
                      return result === 'Not reported' ? result : result + ' µs';
                  }
                  var lines = [
                      'Project ID: ' + display('wioProjectId', 'Not reported'),
                      'Project name: ' + display('wioProjectName', 'Not reported'),
                      'Project version: ' + display('wioProjectVersion', 'Not set')
                  ];
                  var taskIndexes = {};
                  Object.keys(values).forEach(function (name) {
                      var match = /^wioIecTask[^[]+\[(\d+)\]$/.exec(name);
                      if (match) taskIndexes[Number(match[1])] = true;
                  });
                  var indexes = Object.keys(taskIndexes).map(Number).sort(function (left, right) { return left - right; });
                  if (indexes.length === 0) {
                      lines.push('', 'IEC tasks: None reported');
                  }
                  indexes.forEach(function (taskIndex) {
                      lines.push(
                          '',
                          'Task ' + taskIndex + ': ' + display('wioIecTaskName[' + taskIndex + ']', 'Unnamed'),
                          '  Status: ' + display('wioIecTaskStatus[' + taskIndex + ']', 'Not reported'),
                          '  Mode: ' + display('wioIecTaskMode[' + taskIndex + ']', 'Not reported'),
                          '  Cycle time: ' + cycleTime('wioIecTaskCycleTime[' + taskIndex + ']'),
                          '  Minimum: ' + cycleTime('wioIecTaskCycleTimeMin[' + taskIndex + ']'),
                          '  Maximum: ' + cycleTime('wioIecTaskCycleTimeMax[' + taskIndex + ']'),
                          '  Average: ' + cycleTime('wioIecTaskCycleTimeAvg[' + taskIndex + ']')
                      );
                  });
                  return lines.join('\n');
          tags:
            - tag: component
              value: software
            - tag: device
              value: wago
        - uuid: ce5723e4a34e4c2e916076388e205f1e
          name: 'WAGO: K-bus module count'
          type: DEPENDENT
          key: automation.gateway.wago.module_count
          history: '90d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Number of modules reported in the current WAGO K-bus inventory.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.name == "wioModulCount")].value.first()'
          tags:
            - tag: component
              value: inventory
            - tag: device
              value: wago
        - uuid: e837c48c28fa4a679551953097f8dd25
          name: 'WAGO: K-bus module inventory'
          type: DEPENDENT
          key: automation.gateway.wago.module_inventory
          history: '90d'
          trends: '0'
          value_type: TEXT
          description: 'Ordered K-bus module list. Human-readable meanings are added from {$WAGO_MODULE_DESCRIPTIONS}; unknown articles remain unchanged.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var source = snapshot['{$WAGO_SOURCE}'];
                  if (!source || !Array.isArray(source.metrics)) throw 'WAGO source not found';
                  var descriptions = {$WAGO_MODULE_DESCRIPTIONS};
                  var slots = {};
                  var reportedCount = 'Not reported';
                  source.metrics.forEach(function (metric) {
                      if (metric.name === 'wioModulCount') reportedCount = String(metric.value);
                      var match = /^wioModule(Number|Name|Type)\[(\d+)\]$/.exec(metric.name);
                      if (!match) return;
                      var index = Number(match[2]);
                      if (!slots[index]) slots[index] = {slot: index};
                      slots[index][match[1].toLowerCase()] = metric.value;
                  });
                  var modules = Object.keys(slots).map(function (index) { return slots[index]; }).filter(function (module) { return module.name != null; });
                  modules.sort(function (left, right) { return Number(left.number || left.slot) - Number(right.number || right.slot); });
                  var lines = ['Reported module count: ' + reportedCount];
                  modules.forEach(function (module) {
                      var slot = Number(module.number || module.slot);
                      var article = String(module.name);
                      var label = Object.prototype.hasOwnProperty.call(descriptions, article) ? ' — ' + descriptions[article] : '';
                      var type = module.type == null ? 'not reported' : String(module.type);
                      lines.push(('0' + slot).slice(-2) + ': ' + article + label + ' (type ' + type + ')');
                  });
                  return lines.join('\n');
          tags:
            - tag: component
              value: inventory
            - tag: device
              value: wago
        - uuid: d7a89b3c4e5f4abc9000000000000001
          name: 'WAGO: K-bus layout JSON'
          type: DEPENDENT
          key: automation.gateway.wago.kbus_layout
          history: '90d'
          trends: '0'
          value_type: TEXT
          description: 'Structured JSON consumed by the wago_kbus dashboard widget. Contains the controller article number (from wioArticleName) and the ordered K-bus module list. Used by the widget only; do not use as a text inventory replacement.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var source = snapshot['{$WAGO_SOURCE}'];
                  if (!source || !Array.isArray(source.metrics)) throw 'WAGO source not found';
                  var controllerArticle = null;
                  var slots = {};
                  source.metrics.forEach(function (metric) {
                      if (metric.name === 'wioArticleName') {
                          controllerArticle = String(metric.value);
                      }
                      var match = /^wioModule(Number|Name|Type)\[(\d+)\]$/.exec(metric.name);
                      if (!match) return;
                      var index = Number(match[2]);
                      if (!slots[index]) slots[index] = {slot: index};
                      slots[index][match[1].toLowerCase()] = metric.value;
                  });
                  var modules = Object.keys(slots)
                      .map(function (i) { return slots[i]; })
                      .filter(function (m) { return m.name != null; });
                  modules.sort(function (a, b) {
                      return Number(a.number || a.slot) - Number(b.number || b.slot);
                  });
                  return JSON.stringify({
                      controller: controllerArticle,
                      modules: modules.map(function (m) {
                          return {
                              slot: Number(m.number || m.slot),
                              article: String(m.name),
                              type: m.type == null ? null : Number(m.type)
                          };
                      })
                  });
          tags:
            - tag: component
              value: inventory
            - tag: device
              value: wago
        - uuid: 9464045cf8da483a8ecfb006dda6b3fd
          name: 'WAGO: K-bus module inventory signature'
          type: DEPENDENT
          key: automation.gateway.wago.module_inventory.signature
          history: '90d'
          trends: '0'
          value_type: TEXT
          description: 'Canonical slot, article, and type signature used solely to detect physical K-bus inventory changes.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var source = snapshot['{$WAGO_SOURCE}'];
                  if (!source || !Array.isArray(source.metrics)) throw 'WAGO source not found';
                  var slots = {};
                  source.metrics.forEach(function (metric) {
                      var match = /^wioModule(Number|Name|Type)\[(\d+)\]$/.exec(metric.name);
                      if (!match) return;
                      var index = Number(match[2]);
                      if (!slots[index]) slots[index] = {slot: index};
                      slots[index][match[1].toLowerCase()] = metric.value;
                  });
                  var modules = Object.keys(slots).map(function (index) { return slots[index]; }).filter(function (module) { return module.name != null; });
                  modules.sort(function (left, right) { return Number(left.number || left.slot) - Number(right.number || right.slot); });
                  return modules.map(function (module) {
                      return String(module.number || module.slot) + '|' + String(module.name) + '|' + String(module.type == null ? '' : module.type);
                  }).join('\n');
          tags:
            - tag: component
              value: inventory
            - tag: device
              value: wago
          triggers:
            - uuid: 3630107ec8ea4ed58bb8af6f527fe5da
              expression: 'change(/Template HomeAuthMonitorGW by HTTP/automation.gateway.wago.module_inventory.signature)=1'
              name: 'WAGO K-bus module inventory changed'
              priority: WARNING
              description: 'The ordered K-bus slot, article, or vendor type inventory differs from the previous successful snapshot. Verify the attached modules and acknowledge the hardware change.'
        - uuid: 792611d123d24d84a925f7ff285023be
          name: 'TS Service health: Phoenix Contact UPS'
          type: DEPENDENT
          key: automation.gateway.phoenix.health
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Independent Phoenix/NUT collector health: 0 good, 1 degraded, 2 real issue or unavailable. Derived from availability, staleness, UPS status, charge, and battery temperature.'
          valuemap:
            name: 'Collector health'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"]'
            - type: JAVASCRIPT
              parameters:
                - |
                  var source = JSON.parse(value);
                  if (!source.available) return 2;
                  var health = source.stale ? 1 : 0;
                  var values = {};
                  source.metrics.forEach(function (metric) { values[metric.name] = metric.value; });
                  var status = String(values['ups.status'] || '');
                  var tokens = status.split(/\s+/);
                  if (!Object.prototype.hasOwnProperty.call(values, 'ups.status') || !Object.prototype.hasOwnProperty.call(values, 'battery.charge') || !Object.prototype.hasOwnProperty.call(values, 'battery.temperature')) health = 1;
                  if (tokens.indexOf('LB') >= 0 || tokens.indexOf('FSD') >= 0 || tokens.indexOf('OFF') >= 0) return 2;
                  if (status && tokens.indexOf('OL') < 0) health = 1;
                  var charge = Number(values['battery.charge']);
                  if (!isNaN(charge) && charge < Number('{$PHOENIX_BATTERY_CRITICAL}')) return 2;
                  if (!isNaN(charge) && charge < Number('{$PHOENIX_BATTERY_WARNING}')) health = 1;
                  var temperature = Number(values['battery.temperature']);
                  if (!isNaN(temperature) && temperature >= Number('{$PHOENIX_TEMPERATURE_CRITICAL}')) return 2;
                  if (!isNaN(temperature) && temperature >= Number('{$PHOENIX_TEMPERATURE_WARNING}')) health = 1;
                  return health;
          tags:
            - tag: component
              value: health
            - tag: device
              value: phoenix-ups
          triggers:
            - uuid: 3677dc87a6fa403e997d3cf567db8e83
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.phoenix.health)=2'
              name: 'Phoenix UPS service health has a real issue or is unavailable'
              priority: HIGH
            - uuid: ada7f4f7a7824ff59399d15faffa12f9
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.phoenix.health)=1'
              name: 'Phoenix UPS service health is degraded'
              priority: WARNING
        - uuid: ef36034ac500442ca4fa3a5c148296bc
          name: 'Phoenix UPS: Status'
          type: DEPENDENT
          key: automation.gateway.phoenix.status
          history: '30d'
          trends: '0'
          value_type: TEXT
          description: 'Space-separated NUT status flags translated token by token according to RFC 9271; the original flag remains visible in parentheses.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "ups.status")].value.first()'
            - type: JAVASCRIPT
              parameters:
                - |
                  var meanings = {
                      ALARM: 'Intervention required',
                      BOOST: 'Boosting low input voltage',
                      BYPASS: 'Bypass / load on utility power',
                      CAL: 'Calibration running',
                      CHRG: 'Battery charging',
                      COMM: 'Communication OK',
                      DISCHRG: 'Battery discharging',
                      FSD: 'Forced shutdown in progress',
                      LB: 'Low battery',
                      NOCOMM: 'Communication lost',
                      OB: 'On battery',
                      OFF: 'UPS off',
                      OL: 'Online / utility power',
                      OVER: 'UPS overloaded',
                      RB: 'Replace battery',
                      TEST: 'Test running',
                      TICK: 'Heartbeat signal',
                      TOCK: 'Heartbeat signal',
                      TRIM: 'Trimming high input voltage',
                      WAIT: 'Waiting for driver data'
                  };
                  var status = String(value == null ? '' : value).trim();
                  if (status === '') return 'No status reported';
                  return status.split(/\s+/).map(function (token) {
                      return Object.prototype.hasOwnProperty.call(meanings, token)
                          ? meanings[token] + ' (' + token + ')'
                          : 'Unknown status (' + token + ')';
                  }).join(' / ');
          tags:
            - tag: device
              value: phoenix-ups
        - uuid: 70cb2ce9cef84e46b15e1d04ac32fe4f
          name: 'Phoenix UPS: Model'
          type: DEPENDENT
          key: automation.gateway.phoenix.model
          history: '30d'
          trends: '0'
          value_type: TEXT
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "device.model")].value.first()'
          tags:
            - tag: device
              value: phoenix-ups
        - uuid: ea0282a319b24bfbb464b15e07b7bc97
          name: 'Phoenix UPS: Battery charge'
          type: DEPENDENT
          key: automation.gateway.phoenix.battery_charge
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: '%'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
