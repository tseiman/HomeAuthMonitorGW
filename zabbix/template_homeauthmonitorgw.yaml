zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 24fc4306e98358f692fcffdbabec8115
      name: Templates/HomeAuthMonitorGW
  templates:
    - uuid: 5f41680c911c5484abeb0509b4b1ffb8
      template: 'Template HomeAuthMonitorGW by HTTP'
      name: 'Template HomeAuthMonitorGW by HTTP'
      description: 'Read-only monitoring through one authenticated HomeAuthMonitorGW HTTPS cache snapshot.'
      groups:
        - name: Templates/HomeAuthMonitorGW
      items:
        - uuid: 6722b521680d5ee0bd6b22eec3bb0ef5
          name: 'Automation gateway snapshot'
          type: HTTP_AGENT
          key: automation.gateway.snapshot
          delay: '{$AUTOMATION_GATEWAY_INTERVAL}'
          history: '1d'
          trends: '0'
          value_type: TEXT
          url: '{$AUTOMATION_GATEWAY_URL}/api/v1/metrics'
          status_codes: '200'
          follow_redirects: 'NO'
          retrieve_mode: BODY
          output_format: RAW
          timeout: '{$AUTOMATION_GATEWAY_TIMEOUT}'
          verify_peer: 'YES'
          verify_host: 'YES'
          headers:
            - name: Authorization
              value: 'Bearer {$AUTOMATION_GATEWAY_TOKEN}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  if (!snapshot || Array.isArray(snapshot) || typeof snapshot !== 'object') {
                      throw 'snapshot root must be an object';
                  }
                  Object.keys(snapshot).forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!/^[A-Za-z0-9._-]{1,64}$/.test(sourceName) || !source || typeof source !== 'object' || Array.isArray(source)) {
                          throw 'invalid source entry';
                      }
                      if (typeof source.driver !== 'string' || typeof source.available !== 'boolean' || typeof source.stale !== 'boolean' || typeof source.last_success !== 'string' || !Array.isArray(source.metrics)) {
                          throw 'invalid source schema';
                      }
                      if (source.last_success !== '0001-01-01T00:00:00Z' && (isNaN(Date.parse(source.last_success)) || Date.parse(source.last_success) < 0)) {
                          throw 'invalid source timestamp';
                      }
                      source.metrics.forEach(function (metric) {
                          if (!metric || typeof metric !== 'object' || Array.isArray(metric) || typeof metric.name !== 'string' || metric.name.length < 1 || metric.name.length > 128 || typeof metric.value_type !== 'string' || typeof metric.timestamp !== 'string' || !Object.prototype.hasOwnProperty.call(metric, 'value')) {
                              throw 'invalid metric schema';
                          }
                          if (isNaN(Date.parse(metric.timestamp)) || Date.parse(metric.timestamp) < 0) {
                              throw 'invalid metric timestamp';
                          }
                      });
                  });
                  return value;
          tags:
            - tag: component
              value: gateway
          triggers:
            - uuid: 4d319811f912543e9027c490d902c1cd
              expression: 'nodata(/Template HomeAuthMonitorGW by HTTP/automation.gateway.snapshot,5m)=1'
              name: 'Automation gateway has no snapshot data for 5 minutes'
              priority: HIGH
              description: 'The authenticated HTTPS master item has produced no value for five minutes. Check TLS, allowlist, token, and gateway availability.'
        - uuid: 1e0f1d2b76894e31ad44529eb2f21f4d
          name: 'Automation gateway: Overall collector health'
          type: DEPENDENT
          key: automation.gateway.health.overall
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Aggregate of every configured collector. The lowest state wins: 0 not initialized, 1 previously initialized but unreachable or stale, 2 initialized with no metrics, 3 metrics received but a known health check failed, 4 all collectors healthy.'
          valuemap:
            name: 'Overall collector health'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var sourceNames = Object.keys(snapshot);
                  if (sourceNames.length === 0) return 0;
                  var overall = 4;
                  function lower(state) {
                      if (state < overall) overall = state;
                  }
                  function has(object, key) {
                      return Object.prototype.hasOwnProperty.call(object, key);
                  }
                  function invalidOrNotZero(value) {
                      return isNaN(Number(value)) || Number(value) !== 0;
                  }
                  sourceNames.forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!source.last_success || source.last_success === '0001-01-01T00:00:00Z') {
                          lower(0);
                          return;
                      }
                      if (!source.available || source.stale) {
                          lower(1);
                          return;
                      }
                      if (source.metrics.length === 0) {
                          lower(2);
                          return;
                      }
                      var byName = {};
                      var byOID = {};
                      var wagoLike = false;
                      source.metrics.forEach(function (metric) {
                          byName[metric.name] = metric.value;
                          if (metric.labels && typeof metric.labels.oid === 'string') {
                              var oid = metric.labels.oid.replace(/^\./, '');
                              byOID[oid] = metric.value;
                              if (oid.indexOf('1.3.6.1.4.1.13576.') === 0) wagoLike = true;
                          }
                          if (metric.name.indexOf('wio') === 0) wagoLike = true;
                      });
                      var unhealthy = false;
                      if (source.driver === 'nut') {
                          var requiredNUT = ['ups.status', 'battery.charge', 'battery.temperature'];
                          requiredNUT.forEach(function (name) { if (!has(byName, name)) unhealthy = true; });
                          var status = String(byName['ups.status'] || '');
                          var tokens = status ? status.split(/\s+/) : [];
                          if (!status || tokens.indexOf('OL') < 0 || tokens.indexOf('LB') >= 0 || tokens.indexOf('FSD') >= 0 || tokens.indexOf('OFF') >= 0) unhealthy = true;
                          var charge = Number(byName['battery.charge']);
                          var temperature = Number(byName['battery.temperature']);
                          if (isNaN(charge) || charge < Number('{$PHOENIX_BATTERY_WARNING}')) unhealthy = true;
                          if (isNaN(temperature) || temperature >= Number('{$PHOENIX_TEMPERATURE_WARNING}')) unhealthy = true;
                      } else if (source.driver === 'snmp' && wagoLike) {
                          var errorGroup = '1.3.6.1.4.1.13576.10.1.20.1.0';
                          var errorCode = '1.3.6.1.4.1.13576.10.1.20.2.0';
                          var errorDescription = '1.3.6.1.4.1.13576.10.1.20.4.0';
                          var rtcBattery = '1.3.6.1.4.1.13576.10.1.11.5.0';
                          [errorGroup, errorCode, errorDescription, rtcBattery].forEach(function (oid) { if (!has(byOID, oid)) unhealthy = true; });
                          if (has(byOID, errorGroup) && invalidOrNotZero(byOID[errorGroup])) unhealthy = true;
                          if (has(byOID, errorCode) && invalidOrNotZero(byOID[errorCode])) unhealthy = true;
                          if (has(byOID, rtcBattery) && invalidOrNotZero(byOID[rtcBattery])) unhealthy = true;
                      }
                      if (unhealthy) lower(3);
                  });
                  return overall;
          tags:
            - tag: component
              value: health
            - tag: scope
              value: overall
        - uuid: 1fa248c88e9c48c38ed250719763a212
          name: 'WAGO: Collector health'
          type: DEPENDENT
          key: automation.gateway.wago.health
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Independent WAGO collector health: 1 healthy, 2 warning, 3 critical. Combines reachability, staleness, WAGO error group/code, and RTC battery state.'
          valuemap:
            name: 'Collector health'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"]'
            - type: JAVASCRIPT
              parameters:
                - |
                  var source = JSON.parse(value);
                  if (!source.available) return 3;
                  var health = source.stale ? 2 : 1;
                  var values = {};
                  source.metrics.forEach(function (metric) {
                      if (metric.labels && typeof metric.labels.oid === 'string') values[metric.labels.oid] = metric.value;
                  });
                  var required = ['1.3.6.1.4.1.13576.10.1.20.1.0', '1.3.6.1.4.1.13576.10.1.20.2.0', '1.3.6.1.4.1.13576.10.1.20.4.0', '1.3.6.1.4.1.13576.10.1.11.5.0'];
                  required.forEach(function (oid) { if (!Object.prototype.hasOwnProperty.call(values, oid)) health = 2; });
                  if ((Object.prototype.hasOwnProperty.call(values, '1.3.6.1.4.1.13576.10.1.20.1.0') && Number(values['1.3.6.1.4.1.13576.10.1.20.1.0']) !== 0) || (Object.prototype.hasOwnProperty.call(values, '1.3.6.1.4.1.13576.10.1.20.2.0') && Number(values['1.3.6.1.4.1.13576.10.1.20.2.0']) !== 0)) return 3;
                  if (Object.prototype.hasOwnProperty.call(values, '1.3.6.1.4.1.13576.10.1.11.5.0') && Number(values['1.3.6.1.4.1.13576.10.1.11.5.0']) !== 0) health = 2;
                  return health;
          tags:
            - tag: component
              value: health
            - tag: device
              value: wago
          triggers:
            - uuid: c7bf160795a84d2dbb13601d5154f496
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.wago.health)=3'
              name: 'WAGO collector health is critical'
              priority: HIGH
            - uuid: 472d5a45cf244473aabd2ece2a4bea98
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.wago.health)=2'
              name: 'WAGO collector health has a warning'
              priority: WARNING
        - uuid: 9e0913d22e404082a7c20fdc461ab4f1
          name: 'WAGO: System uptime'
          type: DEPENDENT
          key: automation.gateway.wago.uptime
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: uptime
          description: 'Controller uptime converted from SNMP TimeTicks (centiseconds) to seconds for human-readable Zabbix display.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.2.1.1.3.0")].value.first()'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: device
              value: wago
          triggers:
            - uuid: f18de41ba3e14f3ab6d5167f719860b0
              expression: 'change(/Template HomeAuthMonitorGW by HTTP/automation.gateway.wago.uptime)<0'
              name: 'WAGO controller has restarted'
              priority: WARNING
        - uuid: 34541c5c0c8e4a9b800f7cb5bf4d7346
          name: 'WAGO: Diagnostic status'
          type: DEPENDENT
          key: automation.gateway.wago.diagnostic
          history: '30d'
          trends: '0'
          value_type: TEXT
          description: 'Human-readable WAGO diagnostic, for example Coupler running, OK.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.20.4.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: 647862f2e1d54b0788b2dd4c7c056b2e
          name: 'WAGO: Diagnostic error code'
          type: DEPENDENT
          key: automation.gateway.wago.error_code
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Current WAGO diagnostic error code; zero means no reported error.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.20.2.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: 828b4c9211764f7586edc1731b83e1cb
          name: 'WAGO: RTC battery status'
          type: DEPENDENT
          key: automation.gateway.wago.rtc_battery
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'RTC backup-battery state reported by the WAGO controller.'
          valuemap:
            name: 'WAGO RTC battery status'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.11.5.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: 4cad44fe65464b9ba4f9c4f6c0d082cd
          name: 'WAGO: IEC task status'
          type: DEPENDENT
          key: automation.gateway.wago.iec_task_status
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Raw IEC task status. No RUN/STOP trigger is enabled until the vendor-specific numeric meanings are observed and confirmed.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.30.9.1.3.1")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: a89ec50e50804a8b9657c965dd66215f
          name: 'WAGO: IEC task cycle time'
          type: DEPENDENT
          key: automation.gateway.wago.iec_cycle_time
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          description: 'Current IEC task cycle-time value. The vendor MIB does not state a reliable unit.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.30.9.1.9.1")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: ff0ced275437462baf773cb45de4ae5a
          name: 'WAGO: Firmware version'
          type: DEPENDENT
          key: automation.gateway.wago.firmware
          history: '30d'
          trends: '0'
          value_type: TEXT
          description: 'Installed WAGO controller firmware version.'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$WAGO_SOURCE}"].metrics[?(@.labels.oid == "1.3.6.1.4.1.13576.10.1.10.4.0")].value.first()'
          tags:
            - tag: device
              value: wago
        - uuid: 792611d123d24d84a925f7ff285023be
          name: 'Phoenix UPS: Collector health'
          type: DEPENDENT
          key: automation.gateway.phoenix.health
          history: '30d'
          trends: '365d'
          value_type: UNSIGNED
          description: 'Independent Phoenix/NUT collector health derived from availability, staleness, UPS status, charge, and battery temperature.'
          valuemap:
            name: 'Collector health'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"]'
            - type: JAVASCRIPT
              parameters:
                - |
                  var source = JSON.parse(value);
                  if (!source.available) return 3;
                  var health = source.stale ? 2 : 1;
                  var values = {};
                  source.metrics.forEach(function (metric) { values[metric.name] = metric.value; });
                  var status = String(values['ups.status'] || '');
                  var tokens = status.split(/\s+/);
                  if (!Object.prototype.hasOwnProperty.call(values, 'ups.status') || !Object.prototype.hasOwnProperty.call(values, 'battery.charge') || !Object.prototype.hasOwnProperty.call(values, 'battery.temperature')) health = 2;
                  if (tokens.indexOf('LB') >= 0 || tokens.indexOf('FSD') >= 0 || tokens.indexOf('OFF') >= 0) return 3;
                  if (status && tokens.indexOf('OL') < 0) health = 2;
                  var charge = Number(values['battery.charge']);
                  if (!isNaN(charge) && charge < Number('{$PHOENIX_BATTERY_CRITICAL}')) return 3;
                  if (!isNaN(charge) && charge < Number('{$PHOENIX_BATTERY_WARNING}')) health = 2;
                  var temperature = Number(values['battery.temperature']);
                  if (!isNaN(temperature) && temperature >= Number('{$PHOENIX_TEMPERATURE_CRITICAL}')) return 3;
                  if (!isNaN(temperature) && temperature >= Number('{$PHOENIX_TEMPERATURE_WARNING}')) health = 2;
                  return health;
          tags:
            - tag: component
              value: health
            - tag: device
              value: phoenix-ups
          triggers:
            - uuid: 3677dc87a6fa403e997d3cf567db8e83
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.phoenix.health)=3'
              name: 'Phoenix UPS collector health is critical'
              priority: HIGH
            - uuid: ada7f4f7a7824ff59399d15faffa12f9
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.phoenix.health)=2'
              name: 'Phoenix UPS collector health has a warning'
              priority: WARNING
        - uuid: ef36034ac500442ca4fa3a5c148296bc
          name: 'Phoenix UPS: Status'
          type: DEPENDENT
          key: automation.gateway.phoenix.status
          history: '30d'
          trends: '0'
          value_type: TEXT
          description: 'NUT status flags rendered with a value map for common Phoenix UPS states.'
          valuemap:
            name: 'NUT UPS status'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "ups.status")].value.first()'
          tags:
            - tag: device
              value: phoenix-ups
        - uuid: 70cb2ce9cef84e46b15e1d04ac32fe4f
          name: 'Phoenix UPS: Model'
          type: DEPENDENT
          key: automation.gateway.phoenix.model
          history: '30d'
          trends: '0'
          value_type: TEXT
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "device.model")].value.first()'
          tags:
            - tag: device
              value: phoenix-ups
        - uuid: ea0282a319b24bfbb464b15e07b7bc97
          name: 'Phoenix UPS: Battery charge'
          type: DEPENDENT
          key: automation.gateway.phoenix.battery_charge
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: '%'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "battery.charge")].value.first()'
          tags:
            - tag: device
              value: phoenix-ups
        - uuid: ff605da8d7b94efb867a8e8922c4a3bf
          name: 'Phoenix UPS: Battery runtime'
          type: DEPENDENT
          key: automation.gateway.phoenix.battery_runtime
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: uptime
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "battery.runtime")].value.first()'
          tags:
            - tag: device
              value: phoenix-ups
        - uuid: bad55974417f4c2a99846bd99db6f5d8
          name: 'Phoenix UPS: Battery temperature'
          type: DEPENDENT
          key: automation.gateway.phoenix.battery_temperature
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: °C
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "battery.temperature")].value.first()'
          tags:
            - tag: device
              value: phoenix-ups
        - uuid: 3cdaa5196ff042dc8ddfe19490ae2b9c
          name: 'Phoenix UPS: Output voltage'
          type: DEPENDENT
          key: automation.gateway.phoenix.output_voltage
          history: '30d'
          trends: '365d'
          value_type: FLOAT
          units: V
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["{$PHOENIX_SOURCE}"].metrics[?(@.name == "output.voltage")].value.first()'
          tags:
            - tag: device
              value: phoenix-ups
      discovery_rules:
        - uuid: e882655e51c6526bbf649b0546193cbe
          name: 'Discover gateway sources'
          type: DEPENDENT
          key: automation.gateway.sources.discovery
          delay: '0'
          lifetime: '7d'
          description: 'Discovers source instances from the cached master snapshot without another HTTP request.'
          item_prototypes:
            - uuid: 3267f8c039d358878c15ed430016ffa8
              name: 'Source {#SOURCE}: available'
              type: DEPENDENT
              key: 'automation.gateway.source.available["{#SOURCE}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              description: 'One means the most recent collector attempt succeeded; zero means it failed.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}.available'
                - type: JAVASCRIPT
                  parameters:
                    - 'return value === "true" ? 1 : 0;'
              tags:
                - tag: component
                  value: source
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
            - uuid: 031866b078e552f7a0a24f8abd2c6bab
              name: 'Source {#SOURCE}: stale'
              type: DEPENDENT
              key: 'automation.gateway.source.stale["{#SOURCE}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              description: 'One means cached source values exceed their configured freshness threshold.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}.stale'
                - type: JAVASCRIPT
                  parameters:
                    - 'return value === "true" ? 1 : 0;'
              tags:
                - tag: component
                  value: source
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
            - uuid: c90c81ede4ab442aa1d58255fe185abb
              name: 'Source {#SOURCE}: health'
              type: DEPENDENT
              key: 'automation.gateway.source.health["{#SOURCE}"]'
              history: '30d'
              trends: '365d'
              value_type: UNSIGNED
              description: 'Independent generic health for this collector: healthy after a successful fresh poll, warning when stale, and critical when unavailable.'
              valuemap:
                name: 'Collector health'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var source = JSON.parse(value);
                      if (!source.available) return 3;
                      if (source.stale) return 2;
                      return 1;
              tags:
                - tag: component
                  value: health
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
            - uuid: 6b25fd6f88865ddb99ec4283b5336b85
              name: 'Source {#SOURCE}: last successful poll'
              type: DEPENDENT
              key: 'automation.gateway.source.last_success["{#SOURCE}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              units: unixtime
              description: 'UTC Unix time of the last successful collector poll.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#SOURCEPATH}.last_success'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value === '0001-01-01T00:00:00Z') {
                          return 0;
                      }
                      var timestamp = Date.parse(value);
                      if (isNaN(timestamp) || timestamp < 0) {
                          throw 'invalid last_success timestamp';
                      }
                      return Math.floor(timestamp / 1000);
              tags:
                - tag: component
                  value: source
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
          trigger_prototypes:
            - uuid: 469ff0ae2c8858d4a0e3ef09d4788eec
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.source.available["{#SOURCE}"])=0'
              name: 'Source {#SOURCE} is unavailable'
              priority: HIGH
              description: 'The latest independent collector attempt failed. The gateway can still expose a last-known-good cached value.'
              tags:
                - tag: scope
                  value: availability
                - tag: source
                  value: '{#SOURCE}'
            - uuid: ce36e410337d5a3eb747650cece1bb2f
              expression: 'last(/Template HomeAuthMonitorGW by HTTP/automation.gateway.source.stale["{#SOURCE}"])=1'
              name: 'Source {#SOURCE} data is stale'
              priority: WARNING
              description: 'Cached values remain visible but must not be treated as current.'
              tags:
                - tag: scope
                  value: freshness
                - tag: source
                  value: '{#SOURCE}'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var sources = [];
                  Object.keys(snapshot).sort().forEach(function (name) {
                      var source = snapshot[name];
                      if (!source || typeof source !== 'object') {
                          return;
                      }
                      sources.push({
                          '{#SOURCE}': name,
                          '{#DRIVER}': typeof source.driver === 'string' ? source.driver : 'unknown',
                          '{#SOURCEPATH}': '$[' + JSON.stringify(name) + ']'
                      });
                  });
                  return JSON.stringify(sources);
        - uuid: 67b8c2a857be586e8290e6806ee70b66
          name: 'Discover gateway metrics'
          type: DEPENDENT
          key: automation.gateway.metrics.discovery
          delay: '0'
          lifetime: '7d'
          description: 'Discovers all metric names in every cached source snapshot without another HTTP request.'
          item_prototypes:
            - uuid: dbe3e3c0e1bf5a4c9279f54668120d9c
              name: 'Source {#SOURCE}: metric {#METRIC}'
              type: DEPENDENT
              key: 'automation.gateway.metric["{#SOURCE}","{#METRIC_KEY}"]'
              history: '7d'
              trends: '0'
              value_type: TEXT
              description: '{#DESCRIPTION}'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#VALUE_JSONPATH}'
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
                - tag: value-type
                  value: '{#VALUE_TYPE}'
                - tag: unit
                  value: '{#UNIT}'
            - uuid: fbd2d27a538e5d39b6d77a8434388d90
              name: 'Source {#SOURCE}: metric {#METRIC} timestamp'
              type: DEPENDENT
              key: 'automation.gateway.metric.timestamp["{#SOURCE}","{#METRIC_KEY}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              units: unixtime
              description: 'UTC Unix time attached to the cached metric value.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#TIMESTAMP_JSONPATH}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var timestamp = Date.parse(value);
                      if (isNaN(timestamp) || timestamp < 0) {
                          throw 'invalid metric timestamp';
                      }
                      return Math.floor(timestamp / 1000);
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var discovered = [];
                  Object.keys(snapshot).sort().forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!source || !Array.isArray(source.metrics)) {
                          return;
                      }
                      source.metrics.forEach(function (metric) {
                          if (!metric || typeof metric.name !== 'string') {
                              return;
                          }
                          if (metric.value_type !== 'string' && metric.value_type !== 'hex') {
                              return;
                          }
                          var metricID = metric.name;
                          var selector = '@.name == ' + JSON.stringify(metric.name);
                          if (metric.labels && typeof metric.labels.oid === 'string') {
                              metricID = metric.labels.oid;
                              selector = '@.labels.oid == ' + JSON.stringify(metric.labels.oid);
                          }
                          var metricKey = '';
                          for (var index = 0; index < metricID.length; index++) {
                              metricKey += ('0000' + metricID.charCodeAt(index).toString(16)).slice(-4);
                          }
                          var base = '$[' + JSON.stringify(sourceName) + '].metrics[?(' + selector + ')]';
                          discovered.push({
                              '{#SOURCE}': sourceName,
                              '{#DRIVER}': typeof source.driver === 'string' ? source.driver : 'unknown',
                              '{#METRIC}': metric.name,
                              '{#METRIC_ID}': metricID,
                              '{#METRIC_KEY}': metricKey,
                              '{#VALUE_TYPE}': typeof metric.value_type === 'string' ? metric.value_type : 'unknown',
                              '{#UNIT}': typeof metric.unit === 'string' ? metric.unit : '',
                              '{#DESCRIPTION}': typeof metric.description === 'string' ? metric.description : 'Current cached text value for ' + metric.name + '.',
                              '{#VALUE_JSONPATH}': base + '.value.first()',
                              '{#TIMESTAMP_JSONPATH}': base + '.timestamp.first()'
                          });
                      });
                  });
                  discovered.sort(function (left, right) {
                      var leftKey = left['{#SOURCE}'] + '\u0000' + left['{#METRIC}'];
                      var rightKey = right['{#SOURCE}'] + '\u0000' + right['{#METRIC}'];
                      return leftKey < rightKey ? -1 : (leftKey > rightKey ? 1 : 0);
                  });
                  return JSON.stringify(discovered);
        - uuid: e53e925bcdb3435ba5fc567f19ba55b3
          name: 'Discover numeric gateway metrics'
          type: DEPENDENT
          key: automation.gateway.numeric_metrics.discovery
          delay: '0'
          lifetime: '7d'
          description: 'Discovers numeric values separately so Zabbix can retain trends and apply numeric triggers.'
          item_prototypes:
            - uuid: 0ace423d3a7b4ce6881b42a2528dadf5
              name: 'Source {#SOURCE}: metric {#METRIC}'
              type: DEPENDENT
              key: 'automation.gateway.metric.numeric["{#SOURCE}","{#METRIC_KEY}"]'
              history: '30d'
              trends: '365d'
              value_type: FLOAT
              units: '{#DISPLAY_UNIT}'
              description: '{#DESCRIPTION}'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#VALUE_JSONPATH}'
                - type: MULTIPLIER
                  parameters:
                    - '{#MULTIPLIER}'
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
                - tag: value-type
                  value: '{#VALUE_TYPE}'
                - tag: unit
                  value: '{#DISPLAY_UNIT}'
            - uuid: 7688bc15166d44db9e4e362a73ce6928
              name: 'Source {#SOURCE}: metric {#METRIC} timestamp'
              type: DEPENDENT
              key: 'automation.gateway.metric.numeric.timestamp["{#SOURCE}","{#METRIC_KEY}"]'
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              units: unixtime
              description: 'UTC Unix time attached to the cached numeric metric value.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '{#TIMESTAMP_JSONPATH}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var timestamp = Date.parse(value);
                      if (isNaN(timestamp) || timestamp < 0) {
                          throw 'invalid metric timestamp';
                      }
                      return Math.floor(timestamp / 1000);
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
                - tag: driver
                  value: '{#DRIVER}'
          master_item:
            key: automation.gateway.snapshot
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var snapshot = JSON.parse(value);
                  var discovered = [];
                  Object.keys(snapshot).sort().forEach(function (sourceName) {
                      var source = snapshot[sourceName];
                      if (!source || !Array.isArray(source.metrics)) {
                          return;
                      }
                      source.metrics.forEach(function (metric) {
                          if (!metric || typeof metric.name !== 'string') {
                              return;
                          }
                          if (metric.value_type !== 'integer' && metric.value_type !== 'counter' && metric.value_type !== 'number') {
                              return;
                          }
                          var metricID = metric.name;
                          var selector = '@.name == ' + JSON.stringify(metric.name);
                          if (metric.labels && typeof metric.labels.oid === 'string') {
                              metricID = metric.labels.oid;
                              selector = '@.labels.oid == ' + JSON.stringify(metric.labels.oid);
                          }
                          var metricKey = '';
                          for (var index = 0; index < metricID.length; index++) {
                              metricKey += ('0000' + metricID.charCodeAt(index).toString(16)).slice(-4);
                          }
                          var base = '$[' + JSON.stringify(sourceName) + '].metrics[?(' + selector + ')]';
                          var multiplier = metric.unit === 'centiseconds' ? '0.01' : '1';
                          var displayUnit = typeof metric.unit === 'string' ? metric.unit : '';
                          if (metric.unit === 'centiseconds') {
                              displayUnit = metric.name === 'sysUpTime' ? 'uptime' : 's';
                          }
                          discovered.push({
                              '{#SOURCE}': sourceName,
                              '{#DRIVER}': typeof source.driver === 'string' ? source.driver : 'unknown',
                              '{#METRIC}': metric.name,
                              '{#METRIC_ID}': metricID,
                              '{#METRIC_KEY}': metricKey,
                              '{#VALUE_TYPE}': metric.value_type,
                              '{#DISPLAY_UNIT}': displayUnit,
                              '{#MULTIPLIER}': multiplier,
                              '{#DESCRIPTION}': typeof metric.description === 'string' ? metric.description : 'Current cached numeric value for ' + metric.name + '.',
                              '{#VALUE_JSONPATH}': base + '.value.first()',
                              '{#TIMESTAMP_JSONPATH}': base + '.timestamp.first()'
                          });
                      });
                  });
                  discovered.sort(function (left, right) {
                      var leftKey = left['{#SOURCE}'] + '\u0000' + left['{#METRIC}'];
                      var rightKey = right['{#SOURCE}'] + '\u0000' + right['{#METRIC}'];
                      return leftKey < rightKey ? -1 : (leftKey > rightKey ? 1 : 0);
                  });
                  return JSON.stringify(discovered);
